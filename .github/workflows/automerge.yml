name: automerge

# Runs after ci finishes rather than on the pull request itself, so the merge
# decision is taken with the run's answer already in hand. `workflow_run` also
# keeps the write token out of anything a pull request's own branch can change.
#
# A pull request that claims a research issue waits for the keeper's reading,
# which is the label `accepted` (.github/CONTRIBUTING.md, Research). Adding a
# label runs no CI, so the label is a second trigger. `pull_request_target`
# runs this file as master holds it, not as the branch does, which is what
# lets it carry the write token.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  pull_request_target:
    types: [labeled]

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'accepted')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Merge an agent's pull request whose checks are green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          number=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq 'map(select(.state == "open")) | first | .number // empty')
          if [ -z "$number" ]; then
            echo "no open pull request has $HEAD_SHA at its head"
            exit 0
          fi

          pull=$(gh api "repos/$REPOSITORY/pulls/$number")
          branch=$(jq -r '.head.ref' <<<"$pull")
          body=$(jq -r '.body // ""' <<<"$pull")
          accepted=$(jq -r 'any(.labels[]; .name == "accepted")' <<<"$pull")

          # A pull request that claims an issue is read by the keeper before
          # it lands, and `accepted` is that reading. It claims by its branch
          # name or by a closing line in its body, either of which is enough.
          claims=false
          case "$branch" in research/*) claims=true ;; esac
          if grep -qiE '(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' <<<"$body"; then
            claims=true
          fi
          if [ "$claims" = true ] && [ "$accepted" != true ]; then
            echo "#$number claims an issue and is not accepted yet"
            exit 0
          fi
          same_repo=$(jq -r '.head.repo.full_name == .base.repo.full_name' <<<"$pull")
          draft=$(jq -r '.draft' <<<"$pull")
          head=$(jq -r '.head.sha' <<<"$pull")
          mergeable=$(jq -r '.mergeable' <<<"$pull")

          # A fork's branch is not this repository's history, and a draft is a
          # pull request its author has said is not finished.
          if [ "$same_repo" != true ] || [ "$draft" != false ]; then
            echo "#$number is a fork or a draft"
            exit 0
          fi
          # The run that woke this job may already be behind its own branch.
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "#$number moved to $head after $HEAD_SHA was checked"
            exit 0
          fi
          # Null means GitHub has not finished computing it, which is not a no.
          if [ "$mergeable" = false ]; then
            echo "#$number does not merge cleanly"
            exit 0
          fi

          # Every commit needs a GPT or Claude co-author, optionally including
          # its model version. Match a trailer line, not a mention in prose.
          authored=$(gh api --paginate "repos/$REPOSITORY/pulls/$number/commits" \
            --jq '.[] | .commit.message | test("(^|\\n)Co-Authored-By:[ \\t]+(GPT|Claude)([- \\t\\r\\n]|$)"; "i")')
          if [ -z "$authored" ] || grep -qx false <<<"$authored"; then
            echo "#$number carries a commit without a GPT or Claude co-author"
            exit 0
          fi
          # The squash lands the body as master's commit message, so the body
          # needs the trailer too.
          if ! jq -e '.body // "" | test("(^|\\n)Co-Authored-By:[ \\t]+(GPT|Claude)([- \\t\\r\\n]|$)"; "i")' <<<"$pull" >/dev/null; then
            echo "#$number has a body without a GPT or Claude co-author"
            exit 0
          fi

          # ci is green by the trigger, and this is every other check on the
          # same commit: docs, and whatever is added later without touching
          # this file. A check still running means the answer is not in yet.
          checks=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "merge")]')
          pending=$(jq -r '[.[] | select(.status != "completed")] | length' <<<"$checks")
          failed=$(jq -r \
            '[.[] | select(.conclusion | IN("success", "skipped", "neutral") | not)] | length' \
            <<<"$checks")
          # A label can arrive before any check has been created; no check at
          # all is not the same as every check green.
          if [ "$(jq length <<<"$checks")" = 0 ]; then
            echo "#$number has no checks yet"
            exit 0
          fi
          if [ "$pending" != 0 ] || [ "$failed" != 0 ]; then
            echo "#$number has $pending check(s) running and $failed not green"
            exit 0
          fi

          # One pull request is one commit on master, titled by the pull
          # request and carrying its body; the repository allows nothing else.
          gh pr merge "$number" --repo "$REPOSITORY" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA"
