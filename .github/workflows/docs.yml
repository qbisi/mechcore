name: docs

on:
  # As in ci: a branch is checked through its pull request, and only the
  # mainline needs the push trigger. A branch's own push run would put a
  # `docs` check on the head before its pull request's run exists.
  push:
    branches: [master]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The checker reads `git ls-files`, so it needs the repository, not a
      # shallow export. Everything else it uses is in the Python standard
      # library, so there is nothing to install.
      - run: python3 scripts/check-docs.py
