name: corpus

# Whether each master commit fights the corpus rounds as their matches say,
# and which rounds it newly fights wrong or refuses. It needs no game and no
# decompilation: the replays are public, and conversion and simulation are the
# release binary's.
#
# It gates nothing and runs on no pull request: the gate waits on ci and docs
# alone, so a replay added to the corpus cannot keep a change from merging. On
# each master commit it keeps verify-matches.py's reports, compares them with
# its parent's, and opens one issue for the rounds the commit newly fights
# wrong or refuses, with a comment on the pull request the commit merged that links it. A
# run that cannot measure still fails, and the failure is for whoever reads the
# run.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Every master commit is kept, because the next one compares with it.
concurrency:
  group: corpus-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      # The scripts job builds the same binary and saves its cache on master;
      # this job only reads it.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-scripts-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-scripts-${{ runner.os }}-

      - name: Release build, without the Adapter
        run: cargo build --release -p mechcore --no-default-features

      # The corpus commit is kept with the reports, so a round new to a run
      # can be told apart from a replay added since the run before.
      - name: Fetch the corpus at its master
        run: |
          python3 scripts/corpus/replay.py sync
          mkdir -p reports
          git -C work/replay rev-parse --short HEAD > reports/corpus-commit

      # A replay of this version the converter refuses, or one that does not
      # come back the same, fails the run here.
      - name: Convert this version's replays into match documents
        run: python3 scripts/corpus/export-replay-corpus.py

      # Whether each round the simulator fights comes out as the match says,
      # every round fought from the position its match states, and which do
      # not or are refused, each match's last round among them. The script
      # exits 1 when a match does not verify, which is what
      # the issue below reports and not a failure of the run; 2 is finding
      # nothing to read.
      - name: Rounds fought as the match says
        run: |
          status=0
          python3 scripts/corpus/verify-matches.py --json-out reports/verify-matches.json \
            > reports/verify-matches.txt || status=$?
          cat reports/verify-matches.txt | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$status" -le 1 ]

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-verify
          path: reports/

      # The reports to compare with: the parent commit's run, or the newest
      # master run that measured when the parent has none.
      - name: Fetch the parent's reports
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.before }}
        run: |
          run=
          if [ -n "$BASE" ]; then
            run=$(gh run list --workflow corpus --commit "$BASE" --status success \
              --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$run" ]; then
            run=$(gh run list --workflow corpus --branch master --event push --status success \
              --json databaseId,headSha --jq "map(select(.headSha != \"$GITHUB_SHA\")) | .[0].databaseId // empty")
          fi
          if [ -n "$run" ]; then
            gh run download "$run" --name corpus-verify --dir before || true
          fi

      # The rounds this commit fights wrong or refuses that its parent did
      # not, as one issue, and a comment on the pull request the commit merged. Which
      # mechanism a round parts on needs the game, which this run does not
      # have.
      - name: Open an issue for the rounds newly fought wrong or refused
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'map(select(.merged_at != null)) | .[0].number // empty')
          python3 scripts/corpus/divergence-issue.py reports --before before \
            --commit "$GITHUB_SHA" --run "$RUN" ${pr:+--pr "$pr"} --out issue
          if [ -f issue/issue.md ]; then
            url=$(gh issue create --title "$(cat issue/issue-title.txt)" \
              --body-file issue/issue.md --label divergence)
            if [ -n "$pr" ]; then
              gh pr comment "$pr" --body "Merged as ${GITHUB_SHA:0:7}, this change fights $(cat issue/count.txt) corpus round(s) wrong or refuses them, which its parent did not: ${url}"
            fi
          fi
