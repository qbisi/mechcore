name: gate

# Says whether a pull request may be merged, and merges nothing. Its answer is
# a commit status named `gate` on the pull request's head, which a ruleset on
# master requires; whoever merges, an agent or a person, asks GitHub to merge
# once the gate is green (`gh pr merge --auto --merge`), and GitHub does.
#
# Runs after ci or docs finishes rather than on the pull request itself, so
# the answer is taken with the run's result already in hand, and the one of
# the two that finishes last answers for both. `workflow_run` runs this file
# as master holds it, whichever workflow woke it, which keeps the write token
# out of anything a pull request's own branch can change.
#
# Every pull request is answered the same way, whether or not it resolves an
# issue: green checks are the whole answer.
on:
  workflow_run:
    workflows: [ci, docs]
    types: [completed]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
      checks: read
    steps:
      - name: Answer whether the pull request at this head may be merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          answer() {
            gh api "repos/$REPOSITORY/statuses/$HEAD_SHA" -f context=gate \
              -f state="$1" -f description="$2" >/dev/null
            echo "$1: $2"
            exit 0
          }

          number=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq 'map(select(.state == "open")) | first | .number // empty')
          if [ -z "$number" ]; then
            echo "no open pull request has $HEAD_SHA at its head"
            exit 0
          fi

          head=$(gh api "repos/$REPOSITORY/pulls/$number" --jq '.head.sha')

          # The run that woke this job may already be behind its own branch;
          # the newer head gets its own answer when its own ci finishes.
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "#$number moved to $head after $HEAD_SHA was checked"
            exit 0
          fi

          # Every workflow run on the commit must be over first. A run exists
          # from the push on, but its later jobs become checks only when the
          # jobs they need are done: ci's test, scripts and adapter appear only
          # once `changes` finishes. Counting checks alone, docs finishing
          # first could find every check that exists green, answer success
          # and let a pull request merge before its tests had run.
          # Only each workflow's latest run on the commit and event counts:
          # one it superseded, cancelled by ci's concurrency group, says
          # nothing about the commit.
          runs=$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name != "gate")]
                  | group_by([.name, .event]) | map(max_by(.created_at))')
          unfinished=$(jq -r '[.[] | select(.status != "completed")] | length' <<<"$runs")
          broken=$(jq -r \
            '[.[] | select(.status == "completed")
                  | select(.conclusion | IN("success", "skipped", "neutral") | not)] | length' \
            <<<"$runs")
          if [ "$broken" != 0 ]; then
            answer failure "$broken workflow run(s) failed on this commit"
          fi
          if [ "$unfinished" != 0 ]; then
            answer pending "$unfinished workflow run(s) still running"
          fi

          # Every check on the commit: ci's jobs, docs, and whatever is added
          # later without touching this file. A check still queued or running
          # means the answer is not in yet, and no check at all is not every
          # check green. Only a completed check has a conclusion: one still
          # queued reads null, which is not a failure.
          checks=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "gate")]')
          if [ "$(jq length <<<"$checks")" = 0 ]; then
            answer pending "no check has started on this commit"
          fi
          pending=$(jq -r '[.[] | select(.status != "completed")] | length' <<<"$checks")
          failed=$(jq -r \
            '[.[] | select(.status == "completed")
                  | select(.conclusion | IN("success", "skipped", "neutral") | not)] | length' \
            <<<"$checks")
          if [ "$failed" != 0 ]; then
            answer failure "$failed check(s) failed on this commit"
          fi
          if [ "$pending" != 0 ]; then
            answer pending "$pending check(s) still running"
          fi

          answer success "every check is green"
