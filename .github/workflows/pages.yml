name: pages

# Build the English Wiki on pull requests; publish only from master.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check documentation conventions
        run: python3 scripts/check/check-docs.py

      - name: Build the static wiki
        run: |
          npm install --no-save --no-package-lock vitepress@1.6.3
          npx vitepress build docs/wiki

      - name: Upload the static wiki
        uses: actions/upload-pages-artifact@v4
        with:
          path: work/pages

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the static wiki
        id: deployment
        uses: actions/deploy-pages@v4
