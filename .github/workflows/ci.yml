name: ci

on:
  # A branch is checked through its pull request, so only the mainline needs
  # the push trigger. Checking both would run every branch twice.
  push:
    branches: [master]
  pull_request:

# A branch's newest push is the only one worth an answer, so an older run on
# the same branch is cancelled. A mainline commit
# is not: every commit has to build and pass on its own, and a cancelled run
# never says whether it did. Keying the mainline by commit gives each its own
# group, so a merge cannot silence the push before it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || 'head' }}
  cancel-in-progress: true

jobs:
  # Does the code say what it should: formatting, lints and the test suite.
  # Only the Adapter is macOS code, so everything else is checked on Linux,
  # without the `adapter` feature that would build it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the nightly and its components, so the first
      # cargo invocation installs exactly what the checkout asks for.
      - name: Show the toolchain the checkout pins
        run: cargo --version && cargo clippy --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-test-${{ runner.os }}-

      # The cheapest check in the file, and the one whose answer is never worth
      # arguing about, so it runs before the ones that take minutes.
      # `.githooks/pre-commit` gives the same answer before the push.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --exclude mechcore-adapter --no-default-features --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude mechcore-adapter --no-default-features

  # Does the release binary still answer what the repository claims: the
  # fixtures, the corpus, every offline script and every tracked battle. A
  # different question from the test suite's, so it runs beside it.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-scripts-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-scripts-${{ runner.os }}-

      # The replays are byte-exact fixtures: `tests/grbr/README.md` makes hash
      # equality part of the contract, and the battle documents are generated
      # from them, so a hand-edited one would otherwise pass unnoticed.
      - name: Fixtures are the bytes they claim to be
        run: |
          shasum -c tests/grbr/SHA256SUMS
          shasum -c tests/battle/SHA256SUMS

      - name: Release build, without the Adapter
        run: cargo build --release -p mechcore --no-default-features

      # A converter change that nobody regenerated the corpus for leaves
      # `tests/battle` describing an older converter. Regenerating has to be a
      # no-op on a tree that is up to date.
      - name: The battle corpus is what this converter writes
        run: |
          python3 scripts/export-replay-corpus.py
          if [ -n "$(git status --porcelain -- tests/battle)" ]; then
            echo "tests/battle is stale; regenerate it in the same commit:" >&2
            git status --porcelain -- tests/battle >&2
            git --no-pager diff -- tests/battle >&2
            exit 1
          fi

      # An mcscript is a tracked, runnable claim, so every one of them has to
      # parse. The ones that need no game are also run: that is how the
      # measurements under `tests/modifier/` are checked here, against
      # the simulator, while the scripts that recorded them stay a thing only a
      # machine with the game can do.
      - name: Every script parses, and the offline ones pass
        run: |
          for script in $(git ls-files '*.mcscript'); do
            checked=$(./target/release/mechcore run "$script" --check)
            echo "$checked"
            needs_game=$(printf '%s' "$checked" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["game"] or "")')
            if [ -z "$needs_game" ]; then
              ./target/release/mechcore run "$script" >/dev/null
            fi
          done

      # Every tracked battle has to predict each next opening in every leaf the
      # fight does not decide. `docs/spec/document/battle.md` defines the
      # coverage.
      - name: Every tracked battle's transitions are predicted
        run: python3 scripts/verify-battles.py

  # The Adapter is a macOS `cdylib` that patches code through `vm_protect`, and
  # `mechcore` packages it beside its executable by default. This is the one
  # job that needs the platform, so it checks only what the others cannot: the
  # Adapter itself, the packaged build, and the process lookup `game: launch`
  # uses to find a running game.
  adapter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-adapter-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-adapter-${{ runner.os }}-

      - name: Lints, with the Adapter
        run: cargo clippy -p mechcore-adapter -p mechcore --all-targets --all-features -- -D warnings

      - name: The Adapter's tests, and the macOS process lookup
        run: |
          cargo test -p mechcore-adapter
          cargo test -p mechcore --bin mechcore acquire::

      - name: mechcore packages the Adapter
        run: |
          cargo build -p mechcore
          test -f target/debug/libmechcore_adapter.dylib
