# Both technologies at once, which is the measurement.
#
#   value first   (base + value) x (1 + rate)
#   rate first    base x (1 + rate) + value
#
# The three fixtures beside this one pin the scale and the offset exactly, and
# under them the two orders answer different integers. Only one of them is
# what the game plays.

