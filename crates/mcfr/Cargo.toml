[package]
name = "mechcore-mcfr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.89"

[dependencies]
arrow-array = "59.2.0"
arrow-buffer = "59.2.0"
arrow-schema = "59.2.0"
blake3 = "1"
bytes = "1"
mechcore-document = { path = "../document" }
parquet = { version = "59.2.0", default-features = false, features = ["arrow", "zstd"] }
rust-hdf5 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "6", default-features = false }

[lints]
workspace = true
