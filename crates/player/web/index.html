<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · mechcore player</title>
<style>/*{{style}}*/
/*{{hud-font}}*/</style>
</head>
<body>
<canvas id="field"></canvas>
<header id="hud">
  <div id="scoreboard" aria-label="Reactor cores">
    <section class="core blue" id="core-0">
      <svg class="core-frame" id="core-frame-0" aria-hidden="true"></svg>
      <div class="core-track" id="core-track-0" role="meter" aria-label="Blue reactor core"><div class="core-fill" id="core-fill-0"></div><span class="core-value" id="core-value-0"></span></div>
      <div class="core-label"><b id="core-name-0">Blue</b><span class="core-damage" id="core-damage-0"></span></div>
      <div class="core-cards"><div class="supply-card" id="supply-card-0" role="group" aria-label="Blue supply"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="supply-cut-0" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="white"/><path d="M0 13 12 6.3 18 9.7 6 16.3 12 19.7 24 13" fill="none" stroke="black" stroke-width="2" stroke-linejoin="bevel"/></mask></defs><path d="M12 1 22 6.5V17.5L12 23 2 17.5V6.5Z" fill="currentColor" mask="url(#supply-cut-0)"/></svg><span id="supply-value-0">0</span></div><div class="officers"><button id="officer-button-0" type="button" aria-label="Blue officers" aria-controls="officer-list-0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 3-3 10 3-3 14-10-3ZM9 3h11v15h-4M8 10l4 1M7 14l4 1"/></svg><span id="officer-count-0">0</span></button><section class="officer-list" id="officer-list-0" aria-label="Blue officers"></section></div></div>
    </section>
    <div id="battle-clock"><svg id="battle-frame" aria-hidden="true"></svg><b id="battle-round"></b><svg class="clock-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 5v5l-3 2"/></svg><span id="battle-time"></span></div>
    <section class="core red" id="core-1">
      <svg class="core-frame" id="core-frame-1" aria-hidden="true"></svg>
      <div class="core-track" id="core-track-1" role="meter" aria-label="Red reactor core"><div class="core-fill" id="core-fill-1"></div><span class="core-value" id="core-value-1"></span></div>
      <div class="core-label"><b id="core-name-1">Red</b><span class="core-damage" id="core-damage-1"></span></div>
      <div class="core-cards"><div class="supply-card" id="supply-card-1" role="group" aria-label="Red supply"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="supply-cut-1" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="white"/><path d="M0 13 12 6.3 18 9.7 6 16.3 12 19.7 24 13" fill="none" stroke="black" stroke-width="2" stroke-linejoin="bevel"/></mask></defs><path d="M12 1 22 6.5V17.5L12 23 2 17.5V6.5Z" fill="currentColor" mask="url(#supply-cut-1)"/></svg><span id="supply-value-1">0</span></div><div class="officers"><button id="officer-button-1" type="button" aria-label="Red officers" aria-controls="officer-list-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 3-3 10 3-3 14-10-3ZM9 3h11v15h-4M8 10l4 1M7 14l4 1"/></svg><span id="officer-count-1">0</span></button><section class="officer-list" id="officer-list-1" aria-label="Red officers"></section></div></div>
    </section>
  </div>
</header>
<aside id="unit-roster-0" class="unit-roster blue" aria-label="Blue deployment"><div id="roster-list-0" class="roster-scroll" role="list" tabindex="0" aria-label="Blue unit formations"></div></aside>
<aside id="unit-roster-1" class="unit-roster red" aria-label="Red deployment"><div id="roster-list-1" class="roster-scroll" role="list" tabindex="0" aria-label="Red unit formations"></div></aside>
<div id="roster-tooltip" role="tooltip" hidden></div>
<div id="tooltip" hidden></div>
<footer id="controls">
  <div id="scrub">
    <div id="seek-track"><div id="seek-progress"></div></div>
    <canvas id="marks"></canvas>
    <input id="seek" type="range" min="1" value="1" step="any" aria-label="Time">
  </div>
  <div id="control-row">
  <button id="previous-round" type="button" title="Previous round" aria-label="Previous round"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5 8 12l11 7Z"/></svg></button>
  <button id="play" type="button" title="Play or pause (Space)" aria-label="Play"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 4 14 8-14 8Z"/></svg><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7ZM15 5h3v14h-3Z"/></svg></button>
  <button id="next-round" type="button" title="Next round" aria-label="Next round"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l11 7-11 7Z"/></svg></button>
  <span id="clock">0:00.0</span>
  <div class="control-spacer"></div>
  <select id="round" title="Round" aria-label="Round" hidden></select>
  <select id="speed" title="Speed (+ and −)" aria-label="Speed">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
    <option value="8">8×</option>
  </select>
  <details id="display-settings">
    <summary title="Display settings" aria-label="Display settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-.6 2.2-2 .9L5.3 5.5 3 9.5l1.6 1.6v1.8L3 14.5l2.3 4 2.1-.6 2 .9L10 21h4l.6-2.2 2-.9 2.1.6 2.3-4-1.6-1.6v-1.8L21 9.5l-2.3-4-2.1.6-2-.9L14 3Z"/><circle cx="12" cy="12" r="3"/></svg></summary>
    <div class="settings-panel">
      <strong>Display</strong>
      <label><input type="checkbox" id="opt-life" checked> Life bars <kbd>L</kbd></label>
      <label><input type="checkbox" id="opt-damage"> Damage numbers <kbd>D</kbd></label>
      <label><input type="checkbox" id="opt-aim"> Aim lines <kbd>A</kbd></label>
    </div>
  </details>
  <button id="fit" type="button" title="Fit the field (F)" aria-label="Fit the field"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="export-svg" type="button" title="Pause and export this tick as SVG" aria-label="Export tick as SVG"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5.5 3.5 6.5 2h3l1 1.5H14v10H2v-10Z"/><circle cx="8" cy="8.5" r="2.5"/></svg></button>
  </div>
</footer>
<script id="timeline" type="application/json">{{timeline}}</script>
<script id="roster-assets" type="application/json">{{roster-assets}}</script>
<script>/*{{sprites}}*/</script>
<script>/*{{snapshot}}*/</script>
<script>/*{{terrain}}*/</script>
<script>/*{{skill-icons}}*/</script>
<script>/*{{deployment}}*/</script>
<script>/*{{spawn}}*/</script>
<script>/*{{settlement}}*/</script>
<script>/*{{hud}}*/</script>
<script>/*{{roster}}*/</script>
<script>/*{{player}}*/</script>
</body>
</html>
