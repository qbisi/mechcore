[package]
name = "mechcore"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"
mechcore-layout = { path = "../layout" }
mechcore-mcfr = { path = "../mcfr" }
mechcore-protocol = { path = "../protocol" }
mechcore-simulation = { path = "../simulation" }
rmcp = { version = "0.16", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
