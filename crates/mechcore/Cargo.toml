[package]
name = "mechcore"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"
mechcore-document = { path = "../document", features = ["convert"] }
mechcore-mcfr = { path = "../mcfr" }
mechcore-protocol = { path = "../protocol" }
mechcore-simulation = { path = "../simulation" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
mechcore-adapter = { path = "../adapter", artifact = "cdylib", target = "target" }
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
