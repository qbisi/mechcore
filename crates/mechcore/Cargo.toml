[package]
name = "mechcore"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The Adapter is the macOS `cdylib` the game loads, and `mechcore` packages it
# beside its own executable so `game launch` can inject it. Everything else —
# the simulator, the readers, the commands that need no game — needs none of it, so
# a build without this feature is how the CLI builds on any other platform.
[features]
default = ["adapter"]
adapter = ["dep:mechcore-adapter"]

[dependencies]
arrow-array = "59.2.0"
arrow-schema = "59.2.0"
blake3 = "1"
libc = "0.2"
mechcore-document = { path = "../document", features = ["convert"] }
mechcore-mcfr = { path = "../mcfr" }
mechcore-player = { path = "../player" }
mechcore-protocol = { path = "../protocol" }
mechcore-simulation = { path = "../simulation" }
pprof = { version = "0.15", default-features = false, features = ["flamegraph"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "functions"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
mechcore-adapter = { path = "../adapter", artifact = "cdylib", target = "target", optional = true }
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
