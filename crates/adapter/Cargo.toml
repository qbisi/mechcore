[package]
name = "mechcore-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mechcore_adapter"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
jpeg-encoder = "0.6"
mechcore-document = { path = "../document", features = ["convert"] }
blake3 = "1"
mechcore-mcfr = { path = "../mcfr" }
mechcore-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
