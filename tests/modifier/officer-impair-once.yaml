# One copy of Cost Control Specialist on red, whose `damage_rate` and
# `life_rate` are both `-0.11`. A negative rate is not a small enhancement:
# `MultiplicativeDataFloat.Refresh` routes an entry by its sign, so this one
# lands in the accumulator that starts at one and multiplies.
#
# It is on red so that only the Rhino's numbers move. The Rhino's damage
# falls too, which is why the Marksman lives longer than in the control; the
# fight is still one difference, applied to one side. One impairment is 0.89
# under either candidate rule, which makes this the control for
# `officer-impair-twice.yaml`.

