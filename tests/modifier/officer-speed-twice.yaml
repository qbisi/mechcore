# Advanced Power System and Speed Specialist on red, a `speed_value` of `+3`
# each over every unit: the plain integer `officer-speed-once.yaml` puts in
# `DataSet.intDatas`.
#
# Two different officers rather than two of one, because the question is what
# the list does with two entries and not what one officer does twice.
#
