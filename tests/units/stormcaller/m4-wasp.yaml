kind: layout
round: 1

# M4: a ground unit that cannot hit air, against wasps: what it does when
# it can target nothing.
# A standard layout ends before any tower falls: a tower's loss is a
# mechanism of its own. The side that cannot hit the other walks to the
# towers, so the side that can fields three formations.

blue:
  units:
    - {name: stormcaller, index: 0, position: {x: 5, y: -100}}

red:
  units:
    - {name: wasp, index: 0, position: {x: 5, y: -100}}
    - {name: wasp, index: 1, position: {x: 5, y: -140}}
    - {name: wasp, index: 2, position: {x: 5, y: -180}}
