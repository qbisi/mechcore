# Aerial Mode's air attack modifier is removed before its delayed landing.
# Wasp EMP hits on tick 5. Void Eye 13 drops its aircraft lock on tick 6,
# locks tower 1 on tick 7 while still airborne, and lands on tick 25.
# This minimal native fight isolates the modifier from target-dependent range
# technologies and retaliation. The timer is controlled by
# projectile-strikes-a-landed-wraith.yaml.

kind: fight
