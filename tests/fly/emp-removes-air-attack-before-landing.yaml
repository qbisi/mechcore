asserts:
- sql: |
    SELECT
      u.tick,
      u.unit_id,
      u.domain,
      k.enabled__lock_target__kind,
      k.enabled__lock_target__id
    FROM units u
    JOIN units__skills k ON k.tick = u.tick AND k.unit_id = u.unit_id
    WHERE
      u.unit_id = 13
      AND k.skill_slot = 0
      AND u.tick IN (4, 5, 6, 7, 20, 24, 25, 26, 27)
    ORDER BY
      u.tick;
