# Red's final Typhoon dies on the last combat tick, with three shots still in flight.
# Forced timeout settles the surviving blue Marksman without draining those shots.
# The last frame preserves the three projectiles at their final positions,
# and the survivor's life and position. No later combat frame or event is
# recorded. Fractional-experience settlement is covered by
# ../production/captured-owner-current-side.yaml.

