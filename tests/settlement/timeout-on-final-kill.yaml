  - [1, 0, 100]
- sql: |
    SELECT
      tick_count,
      terminal_tick,
      (SELECT count(*) FROM projectiles WHERE tick = fight.terminal_tick) AS in_flight
    FROM fight;
  rows:
  - [2360, 2360, 3]
- sql: |
    SELECT tick, object__id, source__id
    FROM events
    WHERE
      type = 'unit_died'
      AND tick = (SELECT terminal_tick FROM fight)
    ORDER BY
      ordinal;
  rows:
  - [2360, 3, 2]
- sql: |
    SELECT team_id, unit_type_id, count(*) AS alive
    FROM units
    WHERE
      tick = (SELECT terminal_tick FROM fight)
