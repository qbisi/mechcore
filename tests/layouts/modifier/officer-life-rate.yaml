kind: layout
round: 1

# One copy of Advanced Defensive Tactics on red, which
# `config/officer_effects.yaml` gives a `life_rate` of `+0.3` over every unit.
# Everything else is `officer-composition-none.yaml`.
#
# The damage capture measured a rate in the skill channel. A life rate is the
# other channel — MCFR keeps `life_rate` in the unit's own modifier set and
# `damage_rate` in its skill's — so this is what says the same arithmetic holds
# there. The Rhino outlives the fight either way, so the reading is its life:
# `19297 * 1.3 = 25086` whole, less the Marksman's two hits of 2329.

blue:
  units:
    - name: marksman
      index: 0
      position: {x: 0, y: -50}

red:
  officers: [advanced_defensive_tactics]
  units:
    - name: rhino
      index: 0
      position: {x: 5, y: -55}
