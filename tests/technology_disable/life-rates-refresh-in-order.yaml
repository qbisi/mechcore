asserts:
- sql: |
    WITH
      changes AS (
        SELECT
          tick,
          unit_id,
          life__current,
          life__maximum,
          lag(life__current) OVER (PARTITION BY unit_id ORDER BY tick) AS before_life,
          lag(life__maximum) OVER (PARTITION BY unit_id ORDER BY tick) AS before_max
        FROM units
        WHERE
          unit_id = 5
      )
    SELECT tick, unit_id, before_life, before_max, life__current, life__maximum
    FROM changes
    WHERE
      before_max IS NOT NULL
      AND before_max != life__maximum
    ORDER BY
      tick;
