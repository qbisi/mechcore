# The Centurion naturally fires all twenty rounds, enters Melee Mode at tick
# 340, then receives the Marksman's EMP at tick 390. Its melee skill stays
# enabled and deals damage at ticks 416 and 539 while EMP is active. The
# battlefield shield keeps the Arclight alive for the magazine to run out; the
# distant Marksman arrives after the switch. ../extra_weapon/melee-mode.yaml
# controls the natural switch without EMP.

kind: fight
source: game
map_id: 1021
seed: 4242
round: 1
blue:
  core_damage: 0
  techs:
    centurion: [melee_mode]
  units:
  - {name: centurion, index: 0, position: {x: 5, y: -75}, exp: 0/400/2250}
red:
  core_damage: 250
  techs:
    marksman: [electromagnetic_shot]
  units:
  - {name: arclight, index: 0, position: {x: 0, y: -30}}
  - {name: marksman, index: 1, position: {x: 0, y: -260}}
  contraptions:
  - {name: shield, index: 0, position: {x: 0, y: -100}}
asserts:
- sql: |
    SELECT count(*) AS rounds, max(tick) AS last_release
    FROM events
    WHERE type = 'projectile_released' AND source__kind = 'unit'
      AND source__id = 1 AND skill_slot = 0;
  rows:
  - [20, 310]
- sql: |
    SELECT u.tick, u.life__maximum, s.has_enabled,
           s.enabled__state, s.enabled__attack_damage
    FROM units u
    JOIN units__skills s USING (tick, unit_id)
    WHERE u.unit_id = 1 AND s.skill_slot = 1
      AND u.tick IN (339, 340, 389, 390, 416, 539)
    ORDER BY u.tick;
  rows:
  - [339, 16500, 1, lock, 1395]
  - [340, 66000, 1, idle, 5580]
  - [389, 66000, 1, idle, 5580]
  - [390, 66000, 1, idle, 5580]
  - [416, 66000, 1, attack, 5580]
  - [539, 66000, 1, attack, 5580]
- sql: |
    SELECT min(tick) AS first_emp, source__id, target__id, buff_id
    FROM events
    WHERE type = 'buff_applied' AND buff_id = 1002
    GROUP BY source__id, target__id, buff_id;
  rows:
  - [390, 3, 1, 1002]
- sql: |
    SELECT e.tick, e.source__id, e.target__id, e.skill_slot, e.amount,
           EXISTS (SELECT 1 FROM units__buffs b
                   WHERE b.tick = e.tick AND b.unit_id = e.source__id
                     AND b.data__id = 1002) AS emp_active
    FROM events e
    WHERE e.type = 'damage' AND e.source__kind = 'unit'
      AND e.source__id = 1 AND e.skill_slot = 1
    ORDER BY e.tick, e.ordinal;
  rows:
  - [416, 1, 2, 1, 4813, 1]
  - [539, 1, 3, 1, 1622, 1]
ticks: 540
hash: 27:1272671dc00e5a3d90cb004ef677c125f1f10a314de5be6b7383c6935762dbbe
