# A tower's loss hands its buff out in the order blue's objects joined the
# side (`FightTeam.activeActors`): the units deployed, then the
# constructions, then a unit made in the fight, after the turret though it
# was made before the tower fell.
#
# Blue's Vulcan makes a Marksman with Best Partner at t1, and its Anti-Armor
# Turret stands in the far corner when red's Steel Ball takes blue's Energy
# Tower at t231, as in turret-outlasts-the-loss.yaml, which this fight takes
# as its control. The game writes buff 1 on the Fangs, the Vulcan (unit 19),
# the turret (building 3) and then the Marksman (unit 24).

