kind: layout
round: 1

# What does losing a tower of strengthen level 0 write on its side? Level 0
# is the default, so the layout names no levels.
#
# Red's Steel Balls come down blue's Energy Tower column and take the tower;
# blue's Fangs stand at the back under the Research Center, out of the fight
# until the tower has fallen, and carry what the loss writes on blue's units.

blue:
  units:
    - name: fang
      index: 0
      position: {x: 145, y: -300}

red:
  units:
    - name: steel_ball
      index: 0
      position: {x: 145, y: -20}
