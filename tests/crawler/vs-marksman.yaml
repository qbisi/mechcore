# Twenty-four Crawlers charging one Marksman, with nothing between them. A
# Crawler's reach, range 6 and radius 2, exactly cancels a Marksman's radius
# of 8, which puts every Crawler on the edge of the comparison that decides
# whether it is sent to the Marksman's centre or to a computed point: the eight
# in front go to the centre and the sixteen behind do not.
#
# Its assert: the Marksman's shot kills Crawler 8 on tick 136 before its
# attack is over, and the Crawler the selector answers, 4, is out of its
# attack angle; so from 137 to 140 it reads idle with no lock and its weapon
# on Crawler 4, on 141 the weapon clears, and on 142 it locks Crawler 7.

