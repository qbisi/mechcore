# and its Marksman at (140, -80) joined this round. Red's Anti-Armor Turret
# at world (140, 100) faces 180 degrees, its attack facing, as the fight
# starts: in the first round no unit is old (`MechTeam.IsOldUnit`), so it
# scores only blue's towers. Its first search from 180 locks the Marksman
# straight ahead. Its assert reads the turret's lock and its weapon's facing
# on tick 1; `anti-armor-old-unit.yaml` has the same units inherited into round 3.

