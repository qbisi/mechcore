# A turret does not turn to the advance team as round 1 starts.
#
# Round 1. Blue's Marksman at (60, -80) is from the advance team,
# and its Marksman at (140, -80) joined this round. Red's Anti-Armor Turret
# at world (140, 100) faces 180 degrees, its attack facing, as the fight
# starts: in the first round no unit is old (`MechTeam.IsOldUnit`), so it
# scores only blue's towers. Its first search from 180 locks the Marksman
# straight ahead. Its assert reads the turret's lock and its weapon's facing
# on tick 1; `anti-armor-old-unit.yaml` has the same units inherited into round 3.

kind: fight
source: game
map_id: 1021
seed: 4242
round: 1
blue:
  core_damage: 0
  units:
  - {name: marksman, index: 0, position: {x: 60, y: -80}, exp: 0/30/650, source: joined}
  - {name: marksman, index: 1, position: {x: 140, y: -80}, exp: 0/490/650, source: joined}
red:
  core_damage: 100
  units:
  - {name: marksman, index: 0, position: {x: 0, y: -280}, exp: 0/200/650, source: joined}
  constructions:
  - {name: anti_armor_turret, index: 0, position: {x: -140, y: -100}}
asserts:
- sql: |
    SELECT
      b.tick,
      b.building_id,
      b.skill__lock_target__kind,
      b.skill__lock_target__id,
      w.rotation
    FROM buildings b
    JOIN buildings__skill__weapons w
      ON w.tick = b.tick
      AND w.building_id = b.building_id
    WHERE
      b.team_id = 1
      AND b.has_skill
      AND b.tick = 1;
  rows:
  - [1, 5, unit, 2, 773094113251]
ticks: 427
