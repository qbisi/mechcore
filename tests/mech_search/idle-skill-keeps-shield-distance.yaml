# Crawlers 15 and 18 return to blue on death, while summoned Crawlers 51 and 54
# turn red and die between snapshots. Their independent recorders keep their
# counters and read the native current side, not a cached last-live side.
# Native repeats 1197 ticks. Control: covered-tower-motion.yaml, whose mech
# attacker answers IsAttackingEnergyShield false rather than the skill's cache.

