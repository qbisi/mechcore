seed: 1787857041
round: 1
blue:
  units:
  - {name: wraith, index: 0, position: {x: -5, y: -95}}
  - {name: crawler, index: 1, position: {x: 0, y: -135}, rotated: true}
  - {name: steel_ball, index: 2, position: {x: 20, y: -135}, rotated: true}
red:
  units:
  - {name: wraith, index: 0, position: {x: -5, y: -95}}
  - {name: crawler, index: 1, position: {x: 0, y: -135}, rotated: true}
  - {name: steel_ball, index: 2, position: {x: 20, y: -135}, rotated: true}
outcome:
  blue.units[0].exp: 869
