# A mirror match, each side a Wraith, a Crawler formation and a Steel Ball
# formation: sibling exclusion, fallback and a child's range, read from a
# longer fight than two-targets.yaml.
#
# Its asserts read the slots' locks of Wraith 30 on tick 131 (u23, u19, u25,
# u21) and of Wraith 29 on tick 206 (u41, u30, u48, u55); that the unit's
# lock is then the latest a slot took, the fourth's, u55, while the core
# keeps its own, u41; and that u55 stands 60.959 metres edge to edge from
# Wraith 29, beyond the core's 60 and within each child's 70: a child's range
# is its parent's plus ten metres.

# Wraiths among a crowd, read with each unit's `skills` and the
# `skill_attackable_checker` channel (`tests/README.md`). At tick 131 u30's fourth
# slot switches to u21, leaving out u25, which a sibling holds. At tick 205
# u29's fourth slot takes u55 at an edge distance of 60.9585 m, past the
# core's 60: a main child skill reaches its parent's range plus 10 m.

kind: fight
source: game
map_id: 1021
seed: 1787857041
round: 1
blue:
  core_damage: 0
  units:
  - {name: wraith, index: 0, position: {x: -5, y: -95}, exp: 0/869/2250}
  - {name: crawler, index: 1, position: {x: 0, y: -135}, exp: 0/48/450, rotated: true}
  - {name: steel_ball, index: 2, position: {x: 20, y: -135}, exp: 0/273/1000, rotated: true}
red:
  core_damage: 250
  units:
  - {name: wraith, index: 0, position: {x: -5, y: -95}, exp: 0/345/2250}
  - {name: crawler, index: 1, position: {x: 0, y: -135}, exp: 0/47/450, rotated: true}
  - {name: steel_ball, index: 2, position: {x: 20, y: -135}, exp: 0/199/1000, rotated: true}
asserts:
- sql: |
    SELECT
      tick,
      unit_id,
      skill_slot,
      enabled__lock_target__kind,
      enabled__lock_target__id
    FROM units__skills
    WHERE
      (unit_id = 30 AND tick = 131)
      OR (unit_id = 29 AND tick = 206)
    ORDER BY
      tick,
      skill_slot;
  rows:
  - [131, 30, 0, unit, 23]
  - [131, 30, 1, unit, 19]
  - [131, 30, 2, unit, 25]
  - [131, 30, 3, unit, 21]
  - [206, 29, 0, unit, 41]
  - [206, 29, 1, unit, 30]
  - [206, 29, 2, unit, 48]
  - [206, 29, 3, unit, 55]
- sql: |
    SELECT tick, unit_id, mech_lock_target__kind, mech_lock_target__id
    FROM units
    WHERE
      unit_id = 29
      AND tick = 206;
  rows:
  - [206, 29, unit, 55]
- sql: |
    SELECT
      k.skill_slot,
      hypot(q32(t.position__x - s.position__x), q32(t.position__z - s.position__z))
      - q32(s.collision_radius)
      - q32(t.collision_radius)
      <= q32(k.enabled__attack_range) AS reaches
    FROM units s
    JOIN units t ON t.tick = s.tick AND t.unit_id = 55
    JOIN units__skills k ON k.tick = s.tick AND k.unit_id = s.unit_id
    WHERE
      s.unit_id = 29
      AND s.tick = 206
    ORDER BY
      k.skill_slot;
  rows:
  - [0, 0]
  - [1, 1]
  - [2, 1]
  - [3, 1]
ticks: 647
hash: 24:7a90feaf0e535c74dae58c531c89730fbe1a9dfd8b3152ecdf64a45d9d2e4590
