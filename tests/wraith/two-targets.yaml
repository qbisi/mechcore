# What does a slot take when every unit in reach is already held by another?
#
# Blue's Wraith has four slots and red offers exactly two units, two
# Marksmen 40 metres apart, both inside the Wraith's 60-metre range once it
# has closed. Two slots cannot hold a unit of their own; whether they double
# up, and on which, is what separates a search that excludes what the other
# slots hold from one that does not. The Marksmen shoot back and outrange
# the Wraith, so the fight is short; the slots' first allocation is the
# reading.
#
# The slots take u3, u2, u3, u3: a slot that finds every unit held doubles
# up, so sharing is not even allocation. Its assert reads each slot's lock on
# tick 10.

kind: fight
source: game
map_id: 1021
seed: 1787857041
round: 1
blue:
  core_damage: 0
  units:
  - {name: wraith, index: 0, position: {x: 5, y: -35}, exp: 0/400/2250, source: joined}
red:
  core_damage: 250
  units:
  - {name: marksman, index: 0, position: {x: -20, y: -30}, source: joined}
  - {name: marksman, index: 1, position: {x: 20, y: -30}, source: joined}
asserts:
- sql: |
    SELECT
      tick,
      unit_id,
      skill_slot,
      enabled__lock_target__kind,
      enabled__lock_target__id
    FROM units__skills
    WHERE
      unit_id = 1
      AND tick = 10
    ORDER BY
      skill_slot;
  rows:
  - [10, 1, 0, unit, 3]
  - [10, 1, 1, unit, 2]
  - [10, 1, 2, unit, 3]
  - [10, 1, 3, unit, 3]
ticks: 96
hash: 27:e46cd46c3cad72405ed42c0114c2324f598a3bd928cbac799049a7256c214446
