# Two extra weapons that burn sum their fires on the unit. A Vulcan with
# Incendiary Bomb and Sticky Oil Bomb has each write its splash and first
# fireLifeTime onto the unit as its ground fire (`ExtraSkillProvider.
# AddEffect`, `MechDataModifer.AddData`), each under its own source: 18
# metres and 240 ticks each. An Incendiary Bomb's fire burns the unit's sum,
# 36 metres for 480 ticks, while the Sticky Oil Bomb's oil stands at its own
# 18.

