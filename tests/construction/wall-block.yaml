    \  u.mech_lock_target__id,\n  k.enabled__state,\n  k.enabled__attack_target__kind,\n\
    \  k.enabled__attack_target__id\nFROM units u\nJOIN units__skills k\n  ON k.tick\
    \ = u.tick\n  AND k.unit_id = u.unit_id\n  AND k.skill_slot = 0\nWHERE\n  (u.unit_id\
    \ = 2 AND u.tick IN (96, 97))\n  OR (u.unit_id IN (7, 23) AND u.tick = 119)\n\
