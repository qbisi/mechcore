# Does a Defensive Wall stop the other side?
#
# `wall-passage.yaml` asks the same question of the side that placed it. This
# is the other half: red's Crawlers start at world `(-145, 20)` and blue's
# Marksman stands at world `(-140, -100)`, directly behind the middle block of
# blue's wall, so the shortest path between them runs through the wall and a
# Crawler that goes around it went around it on purpose.
#
# Nothing else is within reach of either.
#
# Twenty-four Crawlers pushed along the wall as they strike it change blocks
# between blows, go straight on when a block they had not yet struck falls,
# and take four of the five before the fight ends.
#
# Its assert: Crawler 2, pushed along the wall while striking block 4, reads
# idle with no lock on tick 96 as its swing ends, and has block 3 on 97;
# Crawlers 7 and 23, closing on block 4 without having struck it when another
# fells it, are moving on the Marksman on 119.

