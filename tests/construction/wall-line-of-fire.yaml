# Which wall does a unit attack: the nearest one, or the one in its way?
#
# `wall-block.yaml` cannot tell. Its Crawlers charge straight at the unit
# behind the wall, so the nearest block and the block on the line of fire are
# always the same block, and "nearest within twelve metres" explains its
# readings exactly as well as anything about a line does.
#
# This separates them. Blue's wall stands at `(-140, -55)`, five blocks at
# `x = -164, -152, -140, -128, -116`. Red's Marksman stands at world
# `(-170, 20)`, almost straight above the leftmost block, and blue's Marksman
# stands at world `(-90, -90)`, behind the rightmost. So:
#
#   nearest block        `-164`, 75 metres away, 39 metres off the line
#   block on the line    `-116`, 89 metres away, half a metre off the line
#
# The two rules name different buildings. 136 metres separate the two
# Marksmen, inside the 140 one reaches, so the answer is there at the first
# tick without either of them moving.
#
# Blue's wall is the one this seed's opening already stands, because a release
# anywhere else is refused.
#
# The block the Marksman destroys is neither the nearest block nor the one
# its line passes closest to: it is the nearest of the blocks the line
# reaches, block 6, and everything else stands.
#
# Its assert reads red's Marksman: from tick 2 its lock is on blue's Marksman
# while its weapon is on block 6, the body and the weapons keeping separate
# targets; it fells block 6 on tick 18, and on 19 reads idle with no lock and
# its weapon still on block 6, not on block 7, the next in its line.

kind: fight
source: game
map_id: 1021
seed: 4242
round: 1
blue:
  units:
  - {name: marksman, index: 0, position: {x: -90, y: -90}}
  constructions:
  - {name: defensive_wall, index: 0, position: {x: -140, y: -55}}
red:
  units:
  - {name: marksman, index: 0, position: {x: 170, y: -20}}
outcome:
  blue.units[0].exp: 200
  red.core_damage: 100
  red.units[0].exp: 12
asserts:
- sql: "SELECT u.tick, u.unit_id, u.motion_state, u.mech_lock_target__kind, u.mech_lock_target__id, k.enabled__state, k.enabled__attack_target__kind, k.enabled__attack_target__id FROM units u JOIN units__skills k ON k.tick = u.tick AND k.unit_id = u.unit_id AND k.skill_slot = 0 WHERE u.team_id = 1 AND u.tick IN (2, 18, 19) ORDER BY u.tick"
  rows: [[2, 2, attacking, unit, 1, prepare, building, 6], [18, 2, attacking, unit, 1, attack, building, 6], [19, 2, idle, null, null, cooling, building, 6]]
ticks: 20
hash: 23:c8404bd207587872658702b89ffdbb014f49383dcbf77bdbae61b81deebb7c64
