# A production line's batch that joins at once is numbered as the snapshot
# that finds it numbers new units: by side, then where each make stands, z
# and then x, not in the order the line made them. Red's Fortress makes its
# Fangs with Fang Production; once blue's Marksmen and Arclight have killed
# the first batch, the next eight join on tick 721. They are made in the
# line's order, which their unit_created events keep, and take units 13 to
# 20 by position: the first one made is the sixth by z, unit 18.

kind: fight
source: game
map_id: 1021
seed: 4242
round: 1
blue:
  core_damage: 363
  units:
  - {name: marksman, index: 0, position: {x: 0, y: -280}, exp: 0/12/650, source: joined}
  - {name: marksman, index: 1, position: {x: 120, y: -280}, exp: 0/12/650, source: joined}
  - {name: arclight, index: 2, position: {x: 60, y: -200}, exp: 0/12/750, source: joined}
red:
  core_damage: 0
  techs:
    fortress: [fang_production]
  units:
  - {name: fortress, index: 0, position: {x: 80, y: -60}, exp: 0/800/1600, source: joined}
asserts:
- sql: |
    SELECT object__id
    FROM events
    WHERE
      type = 'unit_created'
      AND tick = 721
    ORDER BY
      ordinal
    LIMIT 3;
  rows:
  - [18]
  - [13]
  - [20]
ticks: 888
hash: 26:c115292cae251f9aa44a94f613716f3ce3953b1a9d4e589697d981c4e51b7001
