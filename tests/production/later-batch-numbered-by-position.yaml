# Fangs with Fang Production; once blue's Marksmen and Arclight have killed
# the first batch, the next eight join on tick 721. They are made in the
# line's order, which their unit_created events keep, and take units 13 to
# 20 by position: the first one made is the sixth by z, unit 18.

