# Incendiary Bomb excludes an interceptor from its building candidates.
# At tick 82 Hound units 2-6 lock unit 35 with their bomb skill, not interceptor
# building 6. At tick 260 the same skills may lock turret building 5.
# The native fight settles blue/red core damage at 0/400; admitting
# the interceptor to the bomb search yielded 0/100. Removing the interceptor
# is a native control for the ordinary unit selection path.

