[workspace]
members = [
    "crates/adapter",
    "crates/layout",
    "crates/mcfr",
    "crates/mechcore",
    "crates/protocol",
    "crates/simulation",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
