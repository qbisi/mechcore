[workspace]
members = [
    "crates/adapter",
    "crates/document",
    "crates/mcfr",
    "crates/mechcore",
    "crates/player",
    "crates/protocol",
    "crates/simulation",
]
resolver = "3"
default-members = ["crates/mechcore"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[profile.release]
codegen-units = 1
lto = "thin"
# Keep unwinding enabled: the independently built Adapter catches panics at
# the game boundary instead of aborting the host process.
strip = "symbols"

# The release build with its symbols kept, so `convert --profile` names the
# functions it samples: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
