[workspace]
members = [
    "crates/adapter",
    "crates/document",
    "crates/mcfr",
    "crates/mechcore",
    "crates/protocol",
    "crates/simulation",
]
resolver = "3"
default-members = ["crates/mechcore"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

# The Adapter is a build-time artifact but runs inside the game. Cargo's
# default build-dependency opt-level=0 is inappropriate for native capture.
[profile.release.build-override]
opt-level = 3
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# `assert!(value.is_empty())` reads better than the `assert_eq!(value, [] as [T; 0])`
# rewrite this lint proposes, and the tests assert emptiness throughout.
assert_is_empty = "allow"
