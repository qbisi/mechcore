schema: mechcore.profile/v1
name: r1-blind

services:
  templates:
    use: templates.r1_macro
    with:
      unit_profiles: data/unit_profiles.yaml
      opening_templates: data/r1_opening.yaml
  opponent:
    use: opponent.replay_unpinned_templates
    with:
      templates: [asym_front, asym_mid, sym_mid, sym_deep]
      samples_per_template: 1
      include_clean_base: false
      jitter:
        shift_x: [-30, 30]
        shift_y: [-20, 20]
      seed: 42
  space:
    use: space.strict_grid
  evaluator:
    use: eval.sim_exact
    with:
      objective: core_delta
      risk_lambda: 0.2

guards:
  - use: guard.max_simulations
    with:
      limit: 240

observers:
  - use: observer.trace

operators:
  keep_top_3:
    use: eval.top_k
    with:
      top_k: 3

pipeline:
  - use: warm_start.own_actions
    with:
      unpin_all_movable: true
  - use: seed.macro_templates
    with:
      templates: [asym_front, asym_mid, sym_mid, sym_deep, asym_split_chaff]
      variants_per_template: 2
      include_clean_base: true
      jitter:
        shift_x: [-30, 30]
        shift_y: [-20, 20]
        unit_jitter_x: 10
        unit_jitter_y: 10
        flip_rotate: true
      seed: 1001
  - use: flow.dedup
  - use: eval.score
  - call: keep_top_3
