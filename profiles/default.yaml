schema: mechcore.profile/v1
name: default

services:
  opponent:
    use: opponent.replay_truth
  space:
    use: space.strict_grid
  evaluator:
    use: eval.sim_exact
    with:
      objective: core_delta

proposers:
  - use: proposer.shift_stub
    with:
      offsets: [0, -10, 10]

guards:
  - use: guard.max_simulations
    with:
      limit: 64
  - use: guard.stagnation
    with:
      patience_sweeps: 1

filters:
  - use: filter.dedup_poses
  - use: filter.scope_bounds

observers:
  - use: observer.trace

operators:
  keep_top_3:
    use: eval.top_k
    with:
      top_k: 3

pipeline:
  - use: warm_start.own_actions
    with:
      unpin_all_movable: true
  - use: eval.score
  - repeat:
      max_iters: 2
      stop_on_bail: true
      body:
        - use: placement.coordinate_sweep
          with:
            keep_per_unit: 2
            beam_width: 3
        - use: flow.dedup
        - call: keep_top_3
  - call: keep_top_3
