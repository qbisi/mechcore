schema: mechcore.economy
game_build: 1.11.1.3.2259

# Prices a round can pay that belong to no unit.

# The blueprints a standard match can reach. A map lists what its
# research centre offers, `PrepareBlueprint` drops every row that
# needs research because no standard rule enables it, and a chain's
# second level is reached by activating its first.

blueprints:
  - {id: 1, name: 黏油弹, supply: 150, grants_skill: 400002}
  - {id: 2, name: 战地回收, supply: 100, grants_skill: 900001}
  - {id: 3, name: 移动信标, supply: 100, grants_skill: 1500001}
  - {id: 4, name: 进攻强化, supply: 100, grants_officer: 20310}
  - {id: 5, name: 防御强化, supply: 100, grants_officer: 20300}
  - {id: 401, name: 进攻强化II, supply: 300, grants_officer: 20311}
  - {id: 501, name: 防御强化II, supply: 300, grants_officer: 20301}

tower_strengthen:
  - {level: 1, supply: 100}
  - {level: 2, supply: 150}
  - {level: 3, supply: 250}
  - {level: 4, supply: 300}

# `supply` is what activating costs, `granted` what it pays back
# at once, and `owed` what it takes from the next round's income.
energy_tower_skills:
  - {id: 1, name: 快速补给, supply: 0, granted: 200, owed: 300}
  - {id: 3, name: 批量征召, supply: 50, granted: 0, owed: 0}
  - {id: 4, name: 精英征召, supply: 100, granted: 0, owed: 0}
  - {id: 5, name: 强化瞄准, supply: 100, granted: 0, owed: 0}
  - {id: 6, name: 高速移动, supply: 50, granted: 0, owed: 0}

# What recovering a construction pays back. Unlike a unit's,
# this is a property of the construction and not of its history.
constructions:
  - {type: defensive_wall, id: 1, recovers: 50}
  - {type: anti_armor_turret, id: 2, recovers: 100}
  - {type: rapid_fire_turret, id: 3, recovers: 100}
  - {type: magnetic_barrier, id: 4, recovers: 50}

# The income rule every versus map shares, checked across the
# 18 of them. A survival map caps at 2000 instead, and
# the two roguelike maps at 1400.
round_supply:
  first: 200
  increase: 200
  max: 4000

# A card with no price of its own is sold at its level's price.
reinforce_levels:
  - {level: 1, supply: 0}
  - {level: 2, supply: 50}
  - {level: 3, supply: 100}
  - {level: 4, supply: 200}
