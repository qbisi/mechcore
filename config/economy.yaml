schema: mechcore.economy

# Prices a round can pay that belong to no unit.

# The blueprints a standard match can reach. A map lists what its
# research centre offers, `PrepareBlueprint` drops every row that
# needs research because no standard rule enables it, and a chain's
# second level is reached by activating its first.

blueprints:
  - {id: 1, name: Sticky Oil Bomb, supply: 150, grants_skill: 400002}
  - {id: 2, name: Field Recovery, supply: 100, grants_skill: 900001}
  - {id: 3, name: Mobile Beacon, supply: 100, grants_skill: 1500001}
  - {id: 4, name: Attack Enhancement, supply: 100, grants_officer: 20310}
  - {id: 5, name: Defense Enhancement, supply: 100, grants_officer: 20300}
  - {id: 401, name: Attack Enhancement II, supply: 300, grants_officer: 20311}
  - {id: 501, name: Defense Enhancement II, supply: 300, grants_officer: 20301}

tower_strengthen:
  - {level: 1, supply: 100}
  - {level: 2, supply: 150}
  - {level: 3, supply: 250}
  - {level: 4, supply: 300}

# `supply` is what activating costs, `granted` what it pays back
# at once, and `owed` what it takes from the next round's income.
# `shop_unit_level` is how much higher a unit bought after it
# arrives, which is a price as well as a level.
energy_tower_skills:
  - {id: 1, name: Rapid Resupply, supply: 0, granted: 200, owed: 300}
  - {id: 3, name: Mass Recruitment, supply: 50, granted: 0, owed: 0}
  - {id: 4, name: Elite Recruitment, supply: 100, granted: 0, shop_unit_level: 1, owed: 0}
  - {id: 5, name: Enhanced Range, supply: 100, granted: 0, owed: 0}
  - {id: 6, name: High Mobility, supply: 50, granted: 0, owed: 0}

# What each technology already researched on a unit adds to the
# next one's price. `UnitUtility.CalculateUpgradeTechnologyCost`
# computes a technology's price as this times the count already
# active plus the technology's own supply, capped by the unit's
# `techUpgradeMaxSupplyLimit` when that is above zero. The step it
# uses is the unit's own `techUpgradeIncreaseSupplyPerCount`, and
# when that is zero or less it falls back to the match-wide
# `Config.upgradeTechnologyCostIncreaseDelta`. Every standard unit
# ships zero, so every standard match uses the fallback, which is
# what this reads.
technology_repeat_step: 200

# What declining an ordinary round's reinforcement pays; a unit
# round pays its pool's `decline_supply` in reinforcements.yaml
# instead. Declining is
# itself an item: `ReinforcementManager.GetGiveUpReinforce`
# returns an `AddSupplyReinforceItem` built per round rather than
# read from a card table. This is the standard map's
# `MatchSetting.giveUpSupply` (`Config.noReinforcementSupply` before
# build 2.0), a shipped field whose name and value match what a
# decline pays. The getter is inlined where it is read, so the
# decompilation records no call to cite: the match is by name and
# value rather than by call chain.
reinforce_decline: 50

# What releasing a contraption costs. The config data container
# does not carry these; they come from the `constraptionDatas`
# object of `level0`.
contraptions:
  - {type: shield, id: 10001, name: Shield Generator, supply: 100}
  - {type: missile, id: 20001, name: Sentry Missile, supply: 50}
  - {type: interceptor, id: 30001, name: Missile Interceptor, supply: 100}

# What recovering a construction pays back. Unlike a unit's,
# this is a property of the construction and not of its history.
constructions:
  - {type: defensive_wall, id: 1, recovers: 50}
  - {type: anti_armor_turret, id: 2, recovers: 100}
  - {type: rapid_fire_turret, id: 3, recovers: 100}

# The income rule every versus map shares, checked across the
# 18 of them. A survival map caps at 2000 instead, and
# the two roguelike maps at 1400.
round_supply:
  first: 200
  increase: 200
  max: 4000

# A card with no price of its own is sold at its level's price.
reinforce_levels:
  - {level: 1, supply: 0}
  - {level: 2, supply: 50}
  - {level: 3, supply: 100}
  - {level: 4, supply: 200}
