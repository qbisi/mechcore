# `supply` is what activating costs, `granted` what it pays back
# at once, and `owed` what it takes from the next round's income.
energy_tower_skills:
  - {id: 1, name: 快速补给, supply: 0, granted: 200, owed: 300}
  - {id: 3, name: 批量征召, supply: 50, granted: 0, owed: 0}
